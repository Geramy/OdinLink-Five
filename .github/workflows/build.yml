name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config \
            libibverbs-dev rdma-core \
            libglib2.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev \
            linux-headers-$(uname -r) gcc-14
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DAEMON=ON -DBUILD_TRAY=ON -DBUILD_VERBS=ON
      - name: Build userspace
        run: |
          cd build
          make -j$(nproc) odl_tb5 odl_tb5_verbs odl_tb5_verbs_provider
          make -j$(nproc) odl_tb5_cli odl_tb5_daemon odl_tb5_tray
      - name: Build kernel module (NHI)
        continue-on-error: true
        run: cd build && make -j$(nproc) driver 2>&1
      - name: Test with Docker Compose
        run: |
          docker compose build odl-test 2>&1
          docker compose run --rm odl-test 2>&1 | grep -E "PASS|FAIL|ALL TESTS"
      - name: Package .deb
        continue-on-error: true
        run: |
          cd build
          sudo cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64 2>&1
          ls *.deb
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-debs
          path: build/*.deb
      - name: Upload DKMS source
        if: always()
        run: |
          V="$(echo "${GITHUB_REF_NAME#v}" | tr '/' '-' | tr -c '[:alnum:]._-' '_')"
          [ -n "$V" ] || V="0.1.0"
          D="/tmp/dkms/usr/src/odl-tb5-${V}/uapi"
          mkdir -p "$D"
          set +e
          cp driver/*.c "$D/../" 2>/dev/null
          cp driver/*.h "$D/../" 2>/dev/null
          cp driver/Kbuild "$D/../" 2>/dev/null
          cp driver/Makefile "$D/../" 2>/dev/null
          cp driver/uapi/odl_tb5_uapi.h "$D/" 2>/dev/null
          cp packaging/dkms.conf "$D/../" 2>/dev/null
          cp packaging/dkms-postinst.sh "$D/../" 2>/dev/null
          cp packaging/dkms-prerm.sh "$D/../" 2>/dev/null
          cp driver/71-odl-tb5.rules /tmp/dkms/ 2>/dev/null
          set -e
          cd /tmp && tar czf "odl-tb5-dkms-${V}.tar.gz" dkms/
      - name: Upload DKMS tarball
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-dkms
          path: /tmp/odl-tb5-dkms-*.tar.gz

  linux-arm64:
    name: Linux (arm64, Apple transport)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            crossbuild-essential-arm64 \
            linux-headers-arm64 \
            cmake pkg-config
      - name: Install arm64 kernel headers
        run: |
          ARCH_KERNEL=$(ls /usr/src/ | grep linux-headers-.*-arm64 | head -1 | sed 's/linux-headers-//')
          echo "KERNEL_VERSION=${ARCH_KERNEL}" >> $GITHUB_ENV
          echo "Using kernel: ${ARCH_KERNEL}"
          sudo ln -sf /usr/src/linux-headers-${ARCH_KERNEL} /lib/modules/${ARCH_KERNEL}/build 2>/dev/null || true
          sudo mkdir -p /lib/modules/${ARCH_KERNEL}/build
      - name: Build kernel module (Apple transport, cross-compile)
        continue-on-error: true
        run: |
          KVER=$(ls /usr/src/ | grep linux-headers-.*-arm64 | head -1 | sed 's/linux-headers-//')
          if [ -z "$KVER" ]; then
            echo "No arm64 kernel headers found, attempting build with host headers"
            KVER=$(uname -r)
          fi
          cd driver
          make -C /lib/modules/${KVER}/build M=$(pwd) \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_THUNDERBOLT=n \
            modules 2>&1 || echo "Kernel module build failed (expected without arm64 Thunderbolt subsystem)"
      - name: Build userspace (arm64 cross-compile)
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DBUILD_DAEMON=OFF -DBUILD_TRAY=OFF -DBUILD_VERBS=OFF
          make -j$(nproc) odl_tb5 2>&1 || true
      - name: Collect driver sources
        if: always()
        run: |
          mkdir -p /tmp/odl-tb5-driver-arm64
          cp driver/*.c /tmp/odl-tb5-driver-arm64/
          cp driver/*.h /tmp/odl-tb5-driver-arm64/
          cp driver/Kbuild /tmp/odl-tb5-driver-arm64/
          cp driver/Makefile /tmp/odl-tb5-driver-arm64/
          cp -r driver/uapi /tmp/odl-tb5-driver-arm64/
      - name: Upload driver sources (arm64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-driver-arm64
          path: /tmp/odl-tb5-driver-arm64/
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-arm64-logs
          path: build/**/*.log

  mac:
    name: macOS (userspace only)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkg-config || true
      - name: Build core library
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DAEMON=OFF -DBUILD_TRAY=OFF -DBUILD_VERBS=OFF
          make -j$(sysctl -n hw.ncpu) odl_tb5 2>&1
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-macos-logs
          path: build/**/*.log
      - name: Upload macOS library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-macos
          path: build/lib*.dylib

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-arm64, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir -p release && find . -name '*.deb' -exec cp {} release/ \;
          find . -name '*.tar.gz' -exec cp {} release/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
