name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config \
            libibverbs-dev rdma-core \
            libglib2.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev \
            linux-headers-$(uname -r) gcc-14
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DAEMON=ON -DBUILD_TRAY=ON -DBUILD_VERBS=ON
      - name: Build userspace
        run: |
          cd build
          make -j$(nproc) odl_tb5 odl_tb5_verbs odl_tb5_verbs_provider
          make -j$(nproc) odl_tb5_cli odl_tb5_daemon odl_tb5_tray
          make -j$(nproc) odl_tb5_test odl_tb5_test_rccl_dmabuf
      # A driver that does not compile must turn this job red. This step used
      # to be continue-on-error, which is how the module reached a PR branch
      # in a state where it had never once been built.
      - name: Build kernel module (NHI backend)
        run: cd build && make -j$(nproc) driver
      # The Apple sources are only reachable when the Thunderbolt subsystem is
      # absent, so the NHI build above never compiles them. Force that config
      # here — it is the same C, and needs no arm64 hardware.
      - name: Build kernel module (Apple backend, CONFIG_USB4 off)
        run: |
          make -C /lib/modules/$(uname -r)/build M=$PWD/driver clean
          make -C /lib/modules/$(uname -r)/build M=$PWD/driver \
            CONFIG_USB4= modules
      - name: Compile Linux-side Mac tensor sender
        run: |
          gcc -Wall -c mac/linux_test/odl_tensor_send.c \
            -Ilib/include -Idriver/uapi -o /tmp/odl_tensor_send.o
      - name: Test with Docker Compose
        # The suite already exits non-zero on failure. It used to be piped
        # straight into grep, so the pipeline reported grep's status and a
        # failing suite went green.
        run: |
          set -o pipefail
          docker compose build odl-test 2>&1
          docker compose run --rm odl-test 2>&1 | tee /tmp/odl-test.log
      - name: Package .deb
        run: |
          cd build
          sudo cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64 2>&1
          ls *.deb
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-debs
          path: build/*.deb
      - name: Upload DKMS source
        if: always()
        run: |
          V="$(echo "${GITHUB_REF_NAME#v}" | tr '/' '-' | tr -c '[:alnum:]._-' '_')"
          [ -n "$V" ] || V="0.1.0"
          D="/tmp/dkms/usr/src/odl-tb5-${V}/uapi"
          mkdir -p "$D"
          set +e
          cp driver/*.c "$D/../" 2>/dev/null
          cp driver/*.h "$D/../" 2>/dev/null
          cp driver/Kbuild "$D/../" 2>/dev/null
          cp driver/Makefile "$D/../" 2>/dev/null
          cp driver/uapi/odl_tb5_uapi.h "$D/" 2>/dev/null
          cp packaging/dkms.conf "$D/../" 2>/dev/null
          cp packaging/dkms-postinst.sh "$D/../" 2>/dev/null
          cp packaging/dkms-prerm.sh "$D/../" 2>/dev/null
          cp driver/71-odl-tb5.rules /tmp/dkms/ 2>/dev/null
          set -e
          cd /tmp && tar czf "odl-tb5-dkms-${V}.tar.gz" dkms/
      - name: Upload DKMS tarball
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-dkms
          path: /tmp/odl-tb5-dkms-*.tar.gz

  linux-arm64:
    name: Linux (arm64, Apple transport)
    # Native arm64. The old job ran on x86_64 and tried to apt-get
    # linux-headers-arm64, an arm64-architecture package that can never
    # install there — so the entire job was a no-op behind continue-on-error.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config \
            linux-headers-$(uname -r)
      - name: Build kernel module (Apple backend)
        run: |
          make -C /lib/modules/$(uname -r)/build M=$PWD/driver \
            CONFIG_USB4= modules
      - name: Build kernel module (NHI backend)
        run: |
          make -C /lib/modules/$(uname -r)/build M=$PWD/driver clean
          make -C /lib/modules/$(uname -r)/build M=$PWD/driver modules
      - name: Build userspace
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DAEMON=OFF -DBUILD_TRAY=OFF -DBUILD_VERBS=OFF
          make -j$(nproc) odl_tb5 odl_tb5_cli odl_tb5_test
      - name: Collect driver sources
        if: always()
        run: |
          mkdir -p /tmp/odl-tb5-driver-arm64
          cp driver/*.c driver/*.h driver/Kbuild driver/Makefile \
            /tmp/odl-tb5-driver-arm64/
          cp -r driver/uapi /tmp/odl-tb5-driver-arm64/
      - name: Upload driver sources (arm64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-driver-arm64
          path: /tmp/odl-tb5-driver-arm64/

  mac:
    # Build coverage only. Every runtime suite needs /dev/odl_tb5_N, and macOS
    # cannot load the kext under CI (SIP), so there is nothing to execute.
    name: macOS (build coverage)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkg-config || true
      - name: Build userspace
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DAEMON=OFF -DBUILD_TRAY=OFF -DBUILD_VERBS=OFF
          make -j$(sysctl -n hw.ncpu) odl_tb5 odl_tb5_cli odl_tb5_test
      - name: Compile RDMA client
        run: |
          clang -Wall -c mac/odl_rdma_client.c \
            -Imac/kext -o /tmp/odl_rdma_client.o
      # The kext had no build coverage at all and could rot unnoticed. Skip
      # rather than fail if a runner image drops the Kernel headers; a compile
      # error in our own source still fails the job.
      - name: Compile kext
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          HDRS="$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          if [ ! -d "$HDRS" ]; then
            echo "::warning::Kernel.framework headers absent from $SDK, skipping kext compile"
            exit 0
          fi
          clang++ -c mac/kext/OdinLinkRDMA.cpp -o /tmp/OdinLinkRDMA.o \
            -isysroot "$SDK" -I"$HDRS" -Imac/kext \
            -arch arm64 -std=c++17 -fno-builtin -fno-exceptions -fno-rtti \
            -fapple-kext -mkernel -nostdinc \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT
      - name: Upload macOS library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-macos
          path: build/lib*.dylib

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-arm64, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir -p release && find . -name '*.deb' -exec cp {} release/ \;
          find . -name '*.tar.gz' -exec cp {} release/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
