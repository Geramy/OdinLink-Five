name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config \
            libibverbs-dev rdma-core \
            libglib2.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev \
            linux-headers-$(uname -r) gcc-14
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DAEMON=ON -DBUILD_TRAY=ON -DBUILD_VERBS=ON
      - name: Build userspace
        run: |
          cd build
          make -j$(nproc) odl_tb5 odl_tb5_verbs odl_tb5_verbs_provider
          make -j$(nproc) odl_tb5_cli odl_tb5_daemon odl_tb5_tray
      - name: Build kernel module
        continue-on-error: true
        run: cd build && make -j$(nproc) driver 2>&1 | tail -10
      - name: Package .deb
        run: |
          cd build && cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64 && ls *.deb
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-debs
          path: build/*.deb
      - name: Upload DKMS source
        if: always()
        run: |
          V="${GITHUB_REF_NAME#v}"; [ -n "$V" ] || V="0.1.0"
          D="/tmp/dkms/usr/src/odl-tb5-${V}/uapi"; mkdir -p "$D"
          cp driver/*.c "$D/../" 2>/dev/null || true
          cp driver/*.h "$D/../" 2>/dev/null || true
          cp driver/Kbuild "$D/../" 2>/dev/null || true
          cp driver/Makefile "$D/../" 2>/dev/null || true
          cp driver/uapi/odl_tb5_uapi.h "$D/" 2>/dev/null || true
          cp packaging/dkms.conf "$D/../" 2>/dev/null || true
          cp packaging/dkms-postinst.sh "$D/../" 2>/dev/null || true
          cp packaging/dkms-prerm.sh "$D/../" 2>/dev/null || true
          cp driver/71-odl-tb5.rules /tmp/dkms/ 2>/dev/null || true
          cd /tmp && tar czf "odl-tb5-dkms-${V}.tar.gz" dkms/
      - name: Upload DKMS tarball
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-dkms
          path: /tmp/odl-tb5-dkms-*.tar.gz

  mac:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkg-config || true
      - name: Build core library
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DAEMON=OFF -DBUILD_TRAY=OFF -DBUILD_VERBS=OFF
          make -j$(sysctl -n hw.ncpu) odl_tb5 2>&1
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-tb5-macos-logs
          path: build/**/*.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir -p release && find . -name '*.deb' -exec cp {} release/ \;
          find . -name '*.tar.gz' -exec cp {} release/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
